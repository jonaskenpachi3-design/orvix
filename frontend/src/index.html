<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0F172A">
  <title>Orvix — Financial Intelligence Platform</title>
  <link rel="icon" type="image/svg+xml" href="/assets/images/orvix-favicon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="description" content="Orvix - Controle e inteligência financeira pessoal">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    // Inline theme script to prevent flash of wrong theme
    (function() {
      try {
        var p = localStorage.getItem('orvix_theme');
        var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = p === 'dark' || ((p === null || p === 'auto') && systemDark);
        document.documentElement.setAttribute('data-bs-theme', isDark ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-bs-theme', 'light');
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>
